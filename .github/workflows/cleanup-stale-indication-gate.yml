name: Cleanup stale indication gate

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Remove stale gate behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          const = Path("custom_components/investment/const.py")
          text = const.read_text(encoding="utf-8")
          text = text.replace('PANEL_ASSET_REVISION = "0.4.0-r23"', 'PANEL_ASSET_REVISION = "0.4.0-r24-main"')
          const.write_text(text, encoding="utf-8")

          ws = Path("custom_components/investment/websocket.py")
          text = ws.read_text(encoding="utf-8")
          old = '''@websocket_api.websocket_command(
              {
                  vol.Required("type"): "investment/set_preferences",
                  vol.Optional("base_currency"): vol.All(str, vol.Length(min=3, max=3)),
                  vol.Optional("language"): vol.In((DEFAULT_UI_LANGUAGE, *SUPPORTED_UI_LANGUAGES)),
                  vol.Optional("incognito"): bool,
                  vol.Optional("incognito_reveal_seconds"): vol.All(
                      vol.Coerce(int), vol.Range(min=0, max=MAX_INCOGNITO_REVEAL_SECONDS)
                  ),
                  vol.Optional("exposed_entities"): [vol.In(EXPOSABLE_ENTITY_METRICS)],
              }
          )'''
          new = '''@websocket_api.websocket_command(
              vol.Schema(
                  {
                      vol.Required("type"): "investment/set_preferences",
                      vol.Optional("base_currency"): vol.All(str, vol.Length(min=3, max=3)),
                      vol.Optional("language"): vol.In((DEFAULT_UI_LANGUAGE, *SUPPORTED_UI_LANGUAGES)),
                      vol.Optional("incognito"): bool,
                      vol.Optional("incognito_reveal_seconds"): vol.All(
                          vol.Coerce(int), vol.Range(min=0, max=MAX_INCOGNITO_REVEAL_SECONDS)
                      ),
                      vol.Optional("exposed_entities"): [vol.In(EXPOSABLE_ENTITY_METRICS)],
                  },
                  extra=vol.REMOVE_EXTRA,
              )
          )'''
          if old not in text:
              raise SystemExit("preference schema block not found")
          text = text.replace(old, new, 1)
          old2 = '''        if not any(key in msg for key in preference_keys):
                      raise ValueError("At least one preference is required")'''
          new2 = '''        if not any(key in msg for key in preference_keys):
                      # Older cached panels may still send retired preference fields.
                      # Treat them as a silent no-op instead of surfacing an error.
                      connection.send_result(msg["id"], {})
                      return'''
          if old2 not in text:
              raise SystemExit("preference empty-check block not found")
          text = text.replace(old2, new2, 1)
          ws.write_text(text, encoding="utf-8")
          PY
          python -m compileall -q custom_components/investment
          git config user.name "Chris Chreece"
          git config user.email "68458228+Chreece@users.noreply.github.com"
          git add custom_components/investment/const.py custom_components/investment/websocket.py
          git diff --cached --quiet && exit 0
          git commit -m "Silently ignore stale indication unlock calls"
          git push origin HEAD:master
