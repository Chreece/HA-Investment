name: Validate

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile integration Python
        run: python -m compileall -q custom_components/investment
      - name: Run pure Python regression tests
        run: python -m pytest -q tests

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  v15-source-apply:
    if: github.event_name == 'push' && github.ref_name == 'v15-research-hardening'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Apply V15 safeguards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          indication = Path('custom_components/investment/indication.py')
          runtime = Path('custom_components/investment/www/investment-panel-runtime.js')

          s = indication.read_text(encoding='utf-8')
          s2 = s.replace('reasons.append("medium_term_momentum_negative")', 'warnings.append("medium_term_momentum_negative")', 1)
          if s2 == s:
              assert 'warnings.append("medium_term_momentum_negative")' in s
          s = s2.replace('reasons.append("price_below_trend_averages")', 'warnings.append("price_below_trend_averages")', 1)
          if s == s2:
              assert 'warnings.append("price_below_trend_averages")' in s2
          indication.write_text(s, encoding='utf-8')

          s = runtime.read_text(encoding='utf-8')
          marker = 'const isScoreHelp=target=>target?.classList?.contains("signal-help");'
          if marker not in s:
              pattern = r'modal\.querySelectorAll\("\.help-label"\)\.forEach\(target=>\{.*?\}\);'
              replacement = '''const coarsePointer=()=>!!window.matchMedia?.("(hover:none), (pointer:coarse)")?.matches;
          const trueHoverMouse=()=>!!window.matchMedia?.("(hover:hover) and (pointer:fine)")?.matches;
          const isMouseHover=e=>e?.pointerType==="mouse"&&trueHoverMouse()&&!coarsePointer();
          const isScoreHelp=target=>target?.classList?.contains("signal-help");
          modal.querySelectorAll(".help-label").forEach(target=>{target.classList.remove("help-open","help-touch");target.removeAttribute("data-help-source");target.removeAttribute("data-help-hover-ready");target.setAttribute("aria-expanded","false");target.addEventListener("pointerenter",e=>{if(isScoreHelp(target))return;if(isMouseHover(e))target.setAttribute("data-help-hover-ready","1");});target.addEventListener("pointermove",e=>{if(isScoreHelp(target))return;if(!isMouseHover(e)||target.getAttribute("data-help-hover-ready")!=="1")return;if(target.getAttribute("data-help-source")!=="hover")openHelp(target,{touch:false,source:"hover"});});target.addEventListener("pointerleave",e=>{target.removeAttribute("data-help-hover-ready");if(isScoreHelp(target))return;if(isMouseHover(e)&&target.getAttribute("data-help-source")==="hover")closeHelp(null);});});'''
              s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
              assert count == 1, 'runtime help block not found'
          old_click = 'const touch=lastPointerType==="touch"||lastPointerType==="pen"||coarsePointer();if(touch)toggleHelp(target,{touch:true,source:"tap"});else closeHelp(null);return;}closeHelp(null);'
          if old_click in s:
              s = s.replace(old_click, 'const touch=lastPointerType==="touch"||lastPointerType==="pen"||coarsePointer();const explicitScore=isScoreHelp(target);if(touch||explicitScore)toggleHelp(target,{touch,source:touch?"tap":"click"});else closeHelp(null);return;}closeHelp(null);', 1)
          if 'signal-help[title]' not in s:
              needle = 'const modal=root.querySelector(".indication-modal");'
              assert needle in s, 'runtime modal anchor not found'
              s = s.replace(needle, needle + '\n    modal?.querySelectorAll(".signal-help[title]").forEach(el=>el.removeAttribute("title"));', 1)
          runtime.write_text(s, encoding='utf-8')
          PY
      - name: Validate V15 changes
        run: |
          python -m pytest -q tests
          python -m compileall -q custom_components tests
          node --check custom_components/investment/www/investment-panel.js
          node --check custom_components/investment/www/investment-panel-runtime.js
          git diff --check
      - name: Commit V15 changes and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/investment/indication.py custom_components/investment/www/investment-panel-runtime.js
          git fetch origin indications --depth=1
          git checkout origin/indications -- .github/workflows/validate.yml
          git add .github/workflows/validate.yml
          git diff --cached --quiet && exit 0
          git commit -m "Refine model presentation safeguards"
          git push
