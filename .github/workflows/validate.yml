name: Validate

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile integration Python
        run: python -m compileall -q custom_components/investment
      - name: Run pure Python regression tests
        run: python -m pytest -q tests

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  v15-source-apply:
    if: github.event_name == 'push' && github.ref_name == 'v15-research-hardening'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Apply V15 safeguards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          indication = Path('custom_components/investment/indication.py')
          runtime = Path('custom_components/investment/www/investment-panel-runtime.js')

          s = indication.read_text(encoding='utf-8')
          s2 = s.replace('reasons.append("medium_term_momentum_negative")', 'warnings.append("medium_term_momentum_negative")', 1)
          if s2 == s:
              assert 'warnings.append("medium_term_momentum_negative")' in s
          s = s2.replace('reasons.append("price_below_trend_averages")', 'warnings.append("price_below_trend_averages")', 1)
          if s == s2:
              assert 'warnings.append("price_below_trend_averages")' in s2
          indication.write_text(s, encoding='utf-8')

          s = runtime.read_text(encoding='utf-8')
          old_hover = 'const isMouseHover=e=>e?.pointerType==="mouse"&&trueHoverMouse()&&!coarsePointer();'
          new_hover = 'const isMouseHover=e=>e?.pointerType==="mouse"&&trueHoverMouse()&&!coarsePointer()&&!e?.target?.closest?.(".signal-help");'
          if old_hover in s:
              s = s.replace(old_hover, new_hover, 1)
          elif new_hover not in s:
              raise SystemExit('runtime: isMouseHover anchor missing')

          # Preserve the existing generic desktop-click contract while adding an
          # explicit score click/tap handler before the modal-level fallback.
          marker = 'modal.addEventListener("click",e=>{'
          score_handler = '''modal.querySelectorAll(".signal-help").forEach(target=>{
        target.addEventListener("click",e=>{
          const touch=lastPointerType==="touch"||lastPointerType==="pen"||coarsePointer();
          toggleHelp(target,{touch,source:touch?"tap":"click"});
          e.preventDefault();
          e.stopPropagation();
        });
      });
      '''
          if 'target.addEventListener("click",e=>{\n          const touch=lastPointerType==="touch"' not in s:
              if marker not in s:
                  raise SystemExit('runtime: modal click marker missing')
              s = s.replace(marker, score_handler + marker, 1)

          # Remove native browser title tooltips on score labels.
          needle = 'const modal=root.querySelector(".indication-modal");'
          if 'signal-help[title]' not in s:
              if needle not in s:
                  raise SystemExit('runtime: modal query marker missing')
              s = s.replace(needle, needle + '\n    modal?.querySelectorAll(".signal-help[title]").forEach(el=>el.removeAttribute("title"));', 1)

          runtime.write_text(s, encoding='utf-8')
          PY
      - name: Validate V15 changes
        run: |
          python -m pytest -q tests
          python -m compileall -q custom_components tests
          node --check custom_components/investment/www/investment-panel.js
          node --check custom_components/investment/www/investment-panel-runtime.js
          git diff --check
      - name: Commit V15 changes and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/investment/indication.py custom_components/investment/www/investment-panel-runtime.js
          git fetch origin indications --depth=1
          git checkout origin/indications -- .github/workflows/validate.yml
          git add .github/workflows/validate.yml
          git diff --cached --quiet && exit 0
          git commit -m "Refine model presentation safeguards"
          git push
