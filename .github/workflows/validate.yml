name: Validate

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile integration Python
        run: python -m compileall -q custom_components/investment
      - name: Syntax-check frontend JavaScript
        run: |
          for file in custom_components/investment/www/*.js; do
            node --check "$file"
          done
      - name: Run pure Python regression tests
        run: python -m pytest -q tests

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
