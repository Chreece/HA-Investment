name: V15 pre-merge validation

on:
  push:
    branches: [v15-test-final]
  workflow_dispatch:

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Apply V15 candidate patch only in CI workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          validated = root / "custom_components/investment/validated_model.py"
          indication = root / "custom_components/investment/indication.py"
          runtime = root / "custom_components/investment/www/investment-panel-runtime.js"

          s = validated.read_text(encoding="utf-8")
          if "MIN_RISK_HISTORY_WEEKS = 156" not in s:
              if "MIN_RISK_HISTORY_WEEKS = 52" not in s:
                  raise SystemExit("risk-history baseline not found")
              s = s.replace("MIN_RISK_HISTORY_WEEKS = 52", "MIN_RISK_HISTORY_WEEKS = 156", 1)
              validated.write_text(s, encoding="utf-8")

          s = indication.read_text(encoding="utf-8")
          if 'warnings.append("medium_term_momentum_negative")' not in s:
              old = 'reasons.append("medium_term_momentum_negative")'
              if old not in s:
                  raise SystemExit("negative momentum emission not found")
              s = s.replace(old, 'warnings.append("medium_term_momentum_negative")', 1)
          if 'warnings.append("price_below_trend_averages")' not in s:
              old = 'reasons.append("price_below_trend_averages")'
              if old not in s:
                  raise SystemExit("below-trend emission not found")
              s = s.replace(old, 'warnings.append("price_below_trend_averages")', 1)
          indication.write_text(s, encoding="utf-8")

          s = runtime.read_text(encoding="utf-8")
          marker = 'const isScoreHelp=target=>target?.classList?.contains("signal-help");'
          if marker not in s:
              old = '''const coarsePointer=()=>!!window.matchMedia?.("(hover:none), (pointer:coarse)")?.matches;
                const trueHoverMouse=()=>!!window.matchMedia?.("(hover:hover) and (pointer:fine)")?.matches;
                const isMouseHover=e=>e?.pointerType==="mouse"&&trueHoverMouse()&&!coarsePointer();
                modal.querySelectorAll(".help-label").forEach(target=>{target.classList.remove("help-open","help-touch");target.removeAttribute("data-help-source");target.removeAttribute("data-help-hover-ready");target.setAttribute("aria-expanded","false");target.addEventListener("pointerenter",e=>{if(isMouseHover(e))target.setAttribute("data-help-hover-ready","1");});target.addEventListener("pointermove",e=>{if(!isMouseHover(e)||target.getAttribute("data-help-hover-ready")!=="1")return;if(target.getAttribute("data-help-source")!=="hover")openHelp(target,{touch:false,source:"hover"});});target.addEventListener("pointerleave",e=>{target.removeAttribute("data-help-hover-ready");if(isMouseHover(e)&&target.getAttribute("data-help-source")==="hover")closeHelp(null);});});'''
              new = '''const coarsePointer=()=>!!window.matchMedia?.("(hover:none), (pointer:coarse)")?.matches;
                const trueHoverMouse=()=>!!window.matchMedia?.("(hover:hover) and (pointer:fine)")?.matches;
                const isMouseHover=e=>e?.pointerType==="mouse"&&trueHoverMouse()&&!coarsePointer();
                const isScoreHelp=target=>target?.classList?.contains("signal-help");
                modal.querySelectorAll(".help-label").forEach(target=>{target.classList.remove("help-open","help-touch");target.removeAttribute("data-help-source");target.removeAttribute("data-help-hover-ready");target.setAttribute("aria-expanded","false");target.addEventListener("pointerenter",e=>{if(isScoreHelp(target))return;if(isMouseHover(e))target.setAttribute("data-help-hover-ready","1");});target.addEventListener("pointermove",e=>{if(isScoreHelp(target))return;if(!isMouseHover(e)||target.getAttribute("data-help-hover-ready")!=="1")return;if(target.getAttribute("data-help-source")!=="hover")openHelp(target,{touch:false,source:"hover"});});target.addEventListener("pointerleave",e=>{target.removeAttribute("data-help-hover-ready");if(isScoreHelp(target))return;if(isMouseHover(e)&&target.getAttribute("data-help-source")==="hover")closeHelp(null);});});'''
              if old not in s:
                  raise SystemExit("score-help runtime block not found")
              s = s.replace(old, new, 1)

          old_click = 'const touch=lastPointerType==="touch"||lastPointerType==="pen"||coarsePointer();if(touch)toggleHelp(target,{touch:true,source:"tap"});else closeHelp(null);return;}closeHelp(null);'
          new_click = 'const touch=lastPointerType==="touch"||lastPointerType==="pen"||coarsePointer();const explicitScore=isScoreHelp(target);if(touch||explicitScore)toggleHelp(target,{touch,source:touch?"tap":"click"});else closeHelp(null);return;}closeHelp(null);'
          if old_click not in s and 'explicitScore=isScoreHelp(target)' not in s:
              raise SystemExit("score-help click handler not found")
          if old_click in s:
              s = s.replace(old_click, new_click, 1)

          if "signal-help[title]" not in s:
              needle = 'const modal=root.querySelector(".indication-modal");'
              if needle not in s:
                  raise SystemExit("modal marker not found")
              s = s.replace(needle, needle + '\n    modal?.querySelectorAll(".signal-help[title]").forEach(el=>el.removeAttribute("title"));', 1)

          runtime.write_text(s, encoding="utf-8")
          PY
      - name: Verify candidate source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path.cwd()
          v = (root / "custom_components/investment/validated_model.py").read_text(encoding="utf-8")
          i = (root / "custom_components/investment/indication.py").read_text(encoding="utf-8")
          r = (root / "custom_components/investment/www/investment-panel-runtime.js").read_text(encoding="utf-8")
          assert "MIN_RISK_HISTORY_WEEKS = 156" in v
          assert 'warnings.append("medium_term_momentum_negative")' in i
          assert 'reasons.append("medium_term_momentum_negative")' not in i
          assert 'warnings.append("price_below_trend_averages")' in i
          assert 'reasons.append("price_below_trend_averages")' not in i
          assert 'const isScoreHelp=target=>target?.classList?.contains("signal-help");' in r
          assert 'explicitScore=isScoreHelp(target)' in r
          assert 'signal-help[title]' in r
          PY
      - name: Compile Python
        run: python -m compileall -q custom_components
      - name: JavaScript syntax
        run: |
          node --check custom_components/investment/www/investment-panel.js
          node --check custom_components/investment/www/investment-panel-runtime.js
      - name: Full regression suite
        run: python -m pytest -q tests
