name: Fix strip workflow path

on:
  push:
    branches:
      - remove-indications-main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make frontend helper resolve local node modules
        run: |
          sed -i 's#/tmp/strip_frontend\.mjs#.strip_frontend.mjs#g' .github/workflows/strip-indications.yml
          rm -f .github/workflows/fix-strip-path.yml
          git config user.name "Chris Chreece"
          git config user.email "68458228+Chreece@users.noreply.github.com"
          git add -A
          git commit -m "Fix indication split workflow module resolution"
          git push origin HEAD:remove-indications-main
