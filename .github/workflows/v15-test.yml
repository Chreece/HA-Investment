name: V15 isolated test
on:
  push:
    branches: [v15-test]
jobs:
  test-v15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Apply candidate changes in CI workspace
        shell: python
        run: |
          from pathlib import Path
          indication=Path('custom_components/investment/indication.py')
          runtime=Path('custom_components/investment/www/investment-panel-runtime.js')
          s=indication.read_text(encoding='utf-8')
          a=s.replace('reasons.append("medium_term_momentum_negative")','warnings.append("medium_term_momentum_negative")',1)
          if a==s: assert 'warnings.append("medium_term_momentum_negative")' in s
          s=a.replace('reasons.append("price_below_trend_averages")','warnings.append("price_below_trend_averages")',1)
          if s==a: assert 'warnings.append("price_below_trend_averages")' in a
          indication.write_text(s,encoding='utf-8')
          s=runtime.read_text(encoding='utf-8')
          old='const isMouseHover=e=>e?.pointerType==="mouse"&&trueHoverMouse()&&!coarsePointer();'
          new='const isMouseHover=e=>e?.pointerType==="mouse"&&trueHoverMouse()&&!coarsePointer()&&!e?.target?.closest?.(".signal-help");'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('runtime hover anchor missing')
          old='if(touch)toggleHelp(target,{touch:true,source:"tap"});else closeHelp(null);return;'
          new='if(touch||target.classList.contains("signal-help"))toggleHelp(target,{touch,source:touch?"tap":"click"});else closeHelp(null);return;'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('runtime click anchor missing')
          needle='const modal=root.querySelector(".indication-modal");'
          if 'signal-help[title]' not in s:
              if needle not in s: raise SystemExit('runtime modal anchor missing')
              s=s.replace(needle,needle+'\n    modal?.querySelectorAll(".signal-help[title]").forEach(el=>el.removeAttribute("title"));',1)
          runtime.write_text(s,encoding='utf-8')
          Path('tests/test_v15_score_help_and_semantics.py').write_text('''from pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\ndef r(p): return (ROOT/p).read_text(encoding="utf-8")\ndef test_score_help_explicit_action_only():\n    s=r("custom_components/investment/www/investment-panel-runtime.js")\n    assert 'const isMouseHover=e=>e?.pointerType==="mouse"&&trueHoverMouse()&&!coarsePointer()&&!e?.target?.closest?.(".signal-help");' in s\n    assert 'if(touch||target.classList.contains("signal-help"))toggleHelp(target,{touch,source:touch?"tap":"click"});else closeHelp(null);return;' in s\n    assert 'signal-help[title]' in s\ndef test_bearish_codes_are_warnings():\n    s=r("custom_components/investment/indication.py")\n    assert 'warnings.append("medium_term_momentum_negative")' in s\n    assert 'warnings.append("price_below_trend_averages")' in s\n    assert 'reasons.append("medium_term_momentum_negative")' not in s\n    assert 'reasons.append("price_below_trend_averages")' not in s\n''',encoding='utf-8')
      - name: Full regression
        run: |
          python -m pytest -q tests
          python -m compileall -q custom_components tests
          node --check custom_components/investment/www/investment-panel.js
          node --check custom_components/investment/www/investment-panel-runtime.js
          git diff --check
