name: Validate

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile integration Python
        run: python -m compileall -q custom_components/investment
      - name: Run pure Python regression tests
        run: python -m pytest -q tests
