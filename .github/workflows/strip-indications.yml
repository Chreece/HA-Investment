name: Strip indications from main line

on:
  push:
    branches:
      - remove-indications-main

permissions:
  contents: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Remove indication backend
        run: |
          cat > /tmp/strip_indications.py <<'PY'
          from __future__ import annotations
          import ast
          import re
          from pathlib import Path

          ROOT = Path("custom_components/investment")

          def source_range(text: str, node: ast.AST, include_decorators: bool = True):
              lines = text.splitlines(keepends=True)
              starts = [0]
              for line in lines:
                  starts.append(starts[-1] + len(line))
              lineno = getattr(node, "lineno", 1)
              if include_decorators and getattr(node, "decorator_list", None):
                  lineno = min([lineno, *[d.lineno for d in node.decorator_list]])
              start = starts[lineno - 1]
              end = starts[getattr(node, "end_lineno", lineno)]
              return start, end

          def remove_defs(path: Path, names: set[str]):
              text = path.read_text(encoding="utf-8")
              tree = ast.parse(text)
              ranges = []
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in names:
                      ranges.append(source_range(text, node))
              for start, end in sorted(ranges, reverse=True):
                  text = text[:start] + text[end:]
              path.write_text(text, encoding="utf-8")

          def replace_def(path: Path, name: str, replacement: str):
              text = path.read_text(encoding="utf-8")
              tree = ast.parse(text)
              candidates = [n for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name]
              if len(candidates) != 1:
                  raise RuntimeError(f"Expected exactly one {name} in {path}, found {len(candidates)}")
              start, end = source_range(text, candidates[0])
              text = text[:start] + replacement.rstrip() + "\n\n" + text[end:]
              path.write_text(text, encoding="utf-8")

          def remove_assignments(path: Path, names: set[str]):
              text = path.read_text(encoding="utf-8")
              tree = ast.parse(text)
              ranges = []
              for node in tree.body:
                  if not isinstance(node, (ast.Assign, ast.AnnAssign)):
                      continue
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  ids = {t.id for t in targets if isinstance(t, ast.Name)}
                  if ids & names:
                      ranges.append(source_range(text, node, False))
              for start, end in sorted(ranges, reverse=True):
                  text = text[:start] + text[end:]
              path.write_text(text, encoding="utf-8")

          def clean_import_from(path: Path, module: str, names: set[str]):
              text = path.read_text(encoding="utf-8")
              tree = ast.parse(text)
              edits = []
              for node in tree.body:
                  if not isinstance(node, ast.ImportFrom) or node.module != module or node.level != 1:
                      continue
                  if not any(a.name in names for a in node.names):
                      continue
                  keep = [a for a in node.names if a.name not in names]
                  start, end = source_range(text, node, False)
                  if not keep:
                      repl = ""
                  else:
                      rendered = []
                      for a in keep:
                          rendered.append(f"    {a.name}" + (f" as {a.asname}" if a.asname else "") + ",")
                      repl = f"from .{module} import (\n" + "\n".join(rendered) + "\n)\n"
                  edits.append((start, end, repl))
              for start, end, repl in sorted(edits, reverse=True):
                  text = text[:start] + repl + text[end:]
              path.write_text(text, encoding="utf-8")

          # No indication constants/module in the release line.
          const = ROOT / "const.py"
          remove_assignments(const, {
              "INDICATION_DISCLAIMER_VERSION", "INDICATION_LEGAL_REGIONS",
              "DEFAULT_INDICATION_LEGAL_REGION", "DEFAULT_INDICATION_PREFERENCES",
          })

          manager = ROOT / "manager.py"
          clean_import_from(manager, "const", {
              "DEFAULT_INDICATION_PREFERENCES", "DEFAULT_INDICATION_LEGAL_REGION",
              "INDICATION_DISCLAIMER_VERSION", "INDICATION_LEGAL_REGIONS",
          })
          clean_import_from(manager, "indication", {
              "DIVERSIFICATION_DEFAULT_MAX_FRACTION", "allocate_budget", "analyze_prices",
              "attach_relative_strength", "balanced_discovery_sample", "sanitize_ai_ranking",
          })
          remove_defs(manager, {
              "_validated_indication_preferences", "_ai_speech", "_json_from_ai_text",
              "_ai_indication_review", "_overlap_symbol", "_overlap_aliases",
              "_fund_top_holdings", "_owned_fund_holdings", "_candidate_portfolio_overlap",
              "_discover_indication_candidates", "async_indication",
          })
          replace_def(manager, "async_set_preferences", '''    async def async_set_preferences(
              self,
              user_id: str,
              *,
              base_currency: str | None = None,
              language: str | None = None,
              incognito: bool | None = None,
              incognito_reveal_seconds: int | None = None,
              exposed_entities: list[str] | None = None,
          ) -> dict[str, Any]:
              """Update private per-user display, privacy and automation preferences."""
              if (
                  base_currency is None
                  and language is None
                  and incognito is None
                  and incognito_reveal_seconds is None
                  and exposed_entities is None
              ):
                  raise ValueError("At least one preference is required")
              if base_currency is not None:
                  if len(base_currency) != 3 or not base_currency.isalpha():
                      raise ValueError("Currency must be a 3-letter code")
                  base_currency = base_currency.upper()
              if language is not None:
                  language = language.lower()
                  if language != DEFAULT_UI_LANGUAGE and language not in SUPPORTED_UI_LANGUAGES:
                      raise ValueError("Unsupported investment UI language")
              normalized_reveal_seconds = None
              if incognito_reveal_seconds is not None:
                  try:
                      normalized_reveal_seconds = int(incognito_reveal_seconds)
                  except (TypeError, ValueError) as err:
                      raise ValueError("Incognito reveal duration must be a whole number of seconds") from err
                  if normalized_reveal_seconds < 0 or normalized_reveal_seconds > MAX_INCOGNITO_REVEAL_SECONDS:
                      raise ValueError(
                          f"Incognito reveal duration must be between 0 and {MAX_INCOGNITO_REVEAL_SECONDS} seconds"
                      )
              normalized_exposed = None
              previous_exposed: list[str] | None = None
              if exposed_entities is not None:
                  if not isinstance(exposed_entities, list):
                      raise ValueError("Exposed entities must be a list")
                  requested = {str(metric) for metric in exposed_entities}
                  unknown = requested - set(EXPOSABLE_ENTITY_METRICS)
                  if unknown:
                      raise ValueError(f"Unsupported automation entity metric: {sorted(unknown)[0]}")
                  normalized_exposed = [
                      metric for metric in EXPOSABLE_ENTITY_METRICS if metric in requested
                  ]
                  previous_exposed = list(
                      (await self.store.async_user(user_id)).get("exposed_entities") or []
                  )
              user = await self.store.async_set_preferences(
                  user_id,
                  base_currency=base_currency,
                  language=language,
                  incognito=incognito,
                  incognito_reveal_seconds=normalized_reveal_seconds,
                  exposed_entities=normalized_exposed,
              )
              self._cache.clear_prefix(("portfolio", user_id))
              self._cache.clear_prefix(("scope_history", user_id))
              if normalized_exposed is not None and previous_exposed != normalized_exposed:
                  async_dispatcher_send(
                      self.hass, SIGNAL_ENTITY_EXPOSURE_CHANGED, user_id, tuple(normalized_exposed)
                  )
              return user''')

          # Remove branch-only metadata from portfolio responses.
          text = manager.read_text(encoding="utf-8")
          branch_only_keys = {
              "developer_indicator_unlocked", "indication_disclaimer_version",
              "indication_disclaimer_accepted_at", "indication_disclaimer_region",
              "indication_disclaimer_language", "required_indication_disclaimer_version",
              "supported_indication_legal_regions", "indication_preferences",
          }
          text = "".join(
              line for line in text.splitlines(keepends=True)
              if not any(re.match(rf'\s*[\"\']{re.escape(key)}[\"\']\s*:', line) for key in branch_only_keys)
          )
          manager.write_text(text, encoding="utf-8")

          storage = ROOT / "storage.py"
          clean_import_from(storage, "const", {
              "DEFAULT_INDICATION_PREFERENCES", "DEFAULT_INDICATION_LEGAL_REGION",
              "INDICATION_DISCLAIMER_VERSION", "INDICATION_LEGAL_REGIONS",
          })
          text = storage.read_text(encoding="utf-8")
          start_marker = '        if "developer_indicator_unlocked" not in user:\n'
          end_marker = '        raw_exposed = user.get("exposed_entities")\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise RuntimeError("Could not locate stored indication migration block")
          cleanup = '''        # Remove data written by the optional indications branch from the release line.\n        for legacy_key in (\n            "developer_indicator_unlocked",\n            "indication_disclaimer_version",\n            "indication_disclaimer_accepted_at",\n            "indication_disclaimer_region",\n            "indication_disclaimer_language",\n            "indication_preferences",\n        ):\n            if legacy_key in user:\n                user.pop(legacy_key, None)\n                changed = True\n'''
          text = text[:start] + cleanup + text[end:]
          # New users on master must never get optional-branch fields.
          for key in (
              "developer_indicator_unlocked", "indication_disclaimer_version",
              "indication_disclaimer_accepted_at", "indication_disclaimer_region",
              "indication_disclaimer_language", "indication_preferences",
          ):
              text = re.sub(rf'^\s*"{re.escape(key)}"\s*:.*\n', '', text, flags=re.M)
          storage.write_text(text, encoding="utf-8")
          replace_def(storage, "async_set_preferences", '''    async def async_set_preferences(
              self,
              user_id: str,
              *,
              base_currency: str | None = None,
              language: str | None = None,
              incognito: bool | None = None,
              incognito_reveal_seconds: int | None = None,
              exposed_entities: list[str] | None = None,
          ) -> dict[str, Any]:
              """Persist per-user display, privacy and automation preferences."""
              async with self._lock:
                  user = self._ensure_user(user_id)
                  if base_currency is not None:
                      user["base_currency"] = base_currency.upper()
                  if language is not None:
                      user["language"] = language.lower()
                  if incognito is not None:
                      user["incognito"] = bool(incognito)
                  if incognito_reveal_seconds is not None:
                      user["incognito_reveal_seconds"] = int(incognito_reveal_seconds)
                  if exposed_entities is not None:
                      selected = set(exposed_entities)
                      user["exposed_entities"] = [
                          metric for metric in EXPOSABLE_ENTITY_METRICS if metric in selected
                      ]
                  await self._store.async_save(self._data)
                  return deepcopy(user)''')

          websocket = ROOT / "websocket.py"
          clean_import_from(websocket, "const", {
              "INDICATION_DISCLAIMER_VERSION", "INDICATION_LEGAL_REGIONS",
          })
          remove_defs(websocket, {"ws_indication"})
          replace_def(websocket, "ws_preferences", '''@websocket_api.websocket_command(
              {
                  vol.Required("type"): "investment/set_preferences",
                  vol.Optional("base_currency"): vol.All(str, vol.Length(min=3, max=3)),
                  vol.Optional("language"): vol.In((DEFAULT_UI_LANGUAGE, *SUPPORTED_UI_LANGUAGES)),
                  vol.Optional("incognito"): bool,
                  vol.Optional("incognito_reveal_seconds"): vol.All(
                      vol.Coerce(int), vol.Range(min=0, max=MAX_INCOGNITO_REVEAL_SECONDS)
                  ),
                  vol.Optional("exposed_entities"): [vol.In(EXPOSABLE_ENTITY_METRICS)],
              }
          )
          @websocket_api.async_response
          async def ws_preferences(hass: HomeAssistant, connection, msg: dict[str, Any]) -> None:
              try:
                  preference_keys = {
                      "base_currency", "language", "incognito",
                      "incognito_reveal_seconds", "exposed_entities",
                  }
                  if not any(key in msg for key in preference_keys):
                      raise ValueError("At least one preference is required")
                  user = await _manager(hass).async_set_preferences(
                      _user_id(connection),
                      base_currency=msg.get("base_currency"),
                      language=msg.get("language"),
                      incognito=msg.get("incognito"),
                      incognito_reveal_seconds=msg.get("incognito_reveal_seconds"),
                      exposed_entities=msg.get("exposed_entities"),
                  )
                  connection.send_result(
                      msg["id"],
                      {
                          "base_currency": user["base_currency"],
                          "language": user.get("language", DEFAULT_UI_LANGUAGE),
                          "incognito": bool(user.get("incognito", False)),
                          "incognito_reveal_seconds": int(
                              user.get("incognito_reveal_seconds", DEFAULT_INCOGNITO_REVEAL_SECONDS)
                          ),
                          "exposed_entities": list(user.get("exposed_entities") or []),
                      },
                  )
              except Exception as err:
                  connection.send_error(msg["id"], "preferences_error", str(err))''')
          text = websocket.read_text(encoding="utf-8")
          text = re.sub(r'^\s*websocket_api\.async_register_command\(hass, ws_indication\)\s*\n', '', text, flags=re.M)
          websocket.write_text(text, encoding="utf-8")

          # Discovery/ranking provider APIs belong exclusively to the optional branch.
          for provider in (ROOT / "providers").glob("*.py"):
              remove_defs(provider, {"async_discover"})
          yahoo = ROOT / "providers/yahoo.py"
          remove_assignments(yahoo, {"_DISCOVERY_SCREENERS", "_DISCOVERY_FALLBACK"})
          remove_defs(yahoo, {"_predefined_screener", "async_fund_top_holdings"})
          for provider in (ROOT / "providers").glob("*.py"):
              text = provider.read_text(encoding="utf-8")
              text = re.sub(r'(?i)investment[- ]indication', 'optional analysis', text)
              text = re.sub(r'(?i)\bindication\b', 'analysis', text)
              provider.write_text(text, encoding="utf-8")

          # Restore ordinary Kraken long-range behavior; weekly 5y sampling was branch-specific.
          kraken = ROOT / "providers/kraken.py"
          text = kraken.read_text(encoding="utf-8")
          text = text.replace('"5y": 10080', '"5y": 1440')
          text = re.sub(
              r'# Long-horizon analysis histories are weekly across providers\. Kraken\'s OHLC\n'
              r'# API is bounded by row count, so weekly sampling both reaches the requested\n'
              r'# five-year horizon and keeps the scorer comparable with Yahoo/Twelve Data/\n'
              r'# Alpha Vantage 5y histories\.\n', '', text
          )
          kraken.write_text(text, encoding="utf-8")

          # Dedicated files cannot ship on the main/release line.
          for path in (ROOT / "indication.py", Path("tests/test_indication.py")):
              if path.exists():
                  path.unlink()

          # Remove any now-empty double blank runs created by AST surgery.
          for path in (const, manager, storage, websocket, *list((ROOT / "providers").glob("*.py"))):
              text = path.read_text(encoding="utf-8")
              text = re.sub(r'\n{4,}', '\n\n\n', text)
              path.write_text(text, encoding="utf-8")
          PY
          python /tmp/strip_indications.py

      - name: Remove indication frontend
        run: |
          npm install --no-save --no-package-lock acorn postcss >/dev/null 2>&1
          cat > /tmp/strip_frontend.mjs <<'JS'
          import fs from 'node:fs';
          import * as acorn from 'acorn';
          import postcss from 'postcss';

          const path='custom_components/investment/www/investment-panel.js';
          let src=fs.readFileSync(path,'utf8');

          function parse(){return acorn.parse(src,{ecmaVersion:'latest',sourceType:'module'});}
          function walk(node, fn){
            if(!node||typeof node!=='object')return;
            fn(node);
            for(const [key,value] of Object.entries(node)){
              if(key==='parent')continue;
              if(Array.isArray(value))for(const item of value)walk(item,fn);
              else if(value&&typeof value==='object'&&typeof value.type==='string')walk(value,fn);
            }
          }
          const removeMethods=new Set([
            'indicationDraftFromStored','indicationPreferencesPayload','persistIndicationDraft',
            'scheduleIndicationPersistence','legalRegionForCountry','legalRegionLabel',
            'legalRegionNotice','legalRegionOptions','registerIndicatorGatePress',
            '_openIndicationCore','openIndication','reviewIndicationLegal','closeIndicationDisclaimer',
            'acceptIndicationDisclaimer','indicationDisclaimerHtml','closeIndication',
            'loadIndicationAiTasks','captureIndicationDraft','indicationAdjustedSuggestion',
            'indicationDisplayAllocation','indicationAllocationExplanation','indicationSignalText',
            'indicationLabel','runIndication','indicationModalHtml','captureViewState','restoreViewState'
          ]);
          let edits=[];
          walk(parse(),node=>{
            if(node.type==='MethodDefinition' && removeMethods.has(node.key?.name)) edits.push([node.start,node.end,'']);
          });
          for(const [start,end,repl] of edits.sort((a,b)=>b[0]-a[0])) src=src.slice(0,start)+repl+src.slice(end);

          // Remove branch-only state and calls from otherwise shared methods.
          let lines=src.split(/(?<=\n)/);
          lines=lines.filter(line=>{
            const s=line.trim();
            if(s.startsWith('this._developerIndicatorUnlocked='))return false;
            if(s.startsWith('this._indicationOpen='))return false;
            if(s.includes('this._developerIndicatorUnlocked=!!portfolio?.developer_indicator_unlocked'))return false;
            if(s.includes('this._indicationPreferencesLoaded&&portfolio?.indication_preferences'))return false;
            if(s.startsWith('const legalRegion=String(this._portfolio?.indication_disclaimer_region'))return false;
            if(s.includes('getElementById("indication")?.addEventListener'))return false;
            if(s.includes('getElementById("indication-gate")?.addEventListener'))return false;
            if(s.includes('this._indicationDisclaimerOpen?this.indicationDisclaimerHtml()'))return false;
            if(s.includes('this._indicationOpen?this.indicationModalHtml()'))return false;
            return true;
          });
          src=lines.join('');
          src=src.replace(/\s*&&\s*!this\._indicationOpen/g,'');
          src=src.replace(/\s*clearTimeout\(this\._indicationPersistTimer\);/g,'');
          src=src.replace(/\s*const viewState=this\.captureViewState\(\);/g,'');
          src=src.replace(/\s*this\.restoreViewState\(viewState\);/g,'');

          // Remove the hidden gate/visible button expression from the shared header line.
          lines=src.split(/(?<=\n)/).map(line=>{
            if(line.includes('${this._developerIndicatorUnlocked?') && line.includes('<button class="icon-btn ${this._incognito')){
              const a=line.indexOf('${this._developerIndicatorUnlocked?');
              const b=line.indexOf('<button class="icon-btn ${this._incognito',a);
              if(a>=0&&b>a)return line.slice(0,a)+line.slice(b);
            }
            if(line.includes('${this._developerIndicatorUnlocked?') && line.includes('<p>${esc(this.t("freeData"))}')){
              const a=line.indexOf('${this._developerIndicatorUnlocked?');
              const b=line.indexOf('<p>${esc(this.t("freeData"))}',a);
              if(a>=0&&b>a)return line.slice(0,a)+line.slice(b);
            }
            return line;
          });
          src=lines.join('');

          // Shared settings backdrop no longer needs exclusions for removed modals.
          src=src.replace('.modal-backdrop:not(.add-backdrop):not(.indication-backdrop):not(.disclaimer-backdrop)', '.modal-backdrop:not(.add-backdrop)');

          // Drop the contiguous bind block for the removed modal/legal controls.
          {
            const start=src.indexOf('    const updateLegalAcceptButton=');
            const end=src.indexOf('    root.querySelectorAll("[data-close-add]")',start);
            if(start>=0&&end>start)src=src.slice(0,start)+src.slice(end);
          }

          // Remove direct string-valued translation properties whose key/value belongs to the removed feature.
          const bad=/indicat|indicator/i;
          for(let pass=0;pass<8;pass++){
            const before=src;
            src=src.replace(/([,{])\s*([A-Za-z_$][\w$]*):("(?:\\.|[^"\\])*")\s*,?/g,(m,prefix,key,val)=>{
              return bad.test(key)||bad.test(val)?prefix:m;
            });
            src=src.replace(/\{\s*,/g,'{').replace(/,\s*}/g,'}');
            if(src===before)break;
          }
          // Incognito target arrays contained two feature-only selector strings.
          src=src.replace(/\s*["']\.indication[^"']*["']\s*,?/gi,'');

          // Remove CSS selector arms/rules for the removed feature using a CSS parser.
          function findStylesTemplate(){
            const ast=parse(); let tpl=null;
            walk(ast,node=>{
              if(tpl||node.type!=='MethodDefinition'||node.key?.name!=='styles')return;
              walk(node.value?.body,child=>{if(!tpl&&child.type==='TemplateLiteral')tpl=child;});
            });
            return tpl;
          }
          const tpl=findStylesTemplate();
          if(tpl && tpl.expressions.length===0 && tpl.quasis.length===1){
            const q=tpl.quasis[0];
            const raw=src.slice(q.start,q.end);
            const root=postcss.parse(raw);
            root.walkRules(rule=>{
              const keep=(rule.selectors||[]).filter(sel=>!bad.test(sel));
              if(!keep.length)rule.remove();
              else rule.selectors=keep;
            });
            src=src.slice(0,q.start)+root.toString()+src.slice(q.end);
          }

          // Remove branch-only token remnants in comments/empty translation patch text.
          src=src.replace(/^.*(?:developerIndicator|developer_indicator).*\n/gmi,'');

          fs.writeFileSync(path,src);
          acorn.parse(src,{ecmaVersion:'latest',sourceType:'module'});
          JS
          node /tmp/strip_frontend.mjs
          rm -rf node_modules

      - name: Verify release line is clean and valid
        run: |
          python -m pip install --disable-pip-version-check pytest >/dev/null
          python -m compileall -q custom_components/investment
          node --check custom_components/investment/www/investment-panel.js
          python -m pytest -q tests
          python - <<'PY'
          from pathlib import Path
          import re
          roots=[Path('custom_components'),Path('tests'),Path('README.md'),Path('CHANGELOG.md'),Path('ARCHITECTURE.md')]
          pattern=re.compile(r'indicat|developer[_-]?indicator|developerIndicator|indicator[-_ ]gate',re.I)
          hits=[]
          for root in roots:
              paths=[root] if root.is_file() else ([p for p in root.rglob('*') if p.is_file()] if root.exists() else [])
              for path in paths:
                  try:text=path.read_text(encoding='utf-8')
                  except Exception:continue
                  for n,line in enumerate(text.splitlines(),1):
                      if pattern.search(line):hits.append(f'{path}:{n}: {line.strip()[:240]}')
          if hits:
              print('\n'.join(hits[:300]))
              raise SystemExit(f'Release line still contains {len(hits)} indication references')
          print('INDICATION_REFERENCES=0')
          PY

      - name: Commit clean main-line variant
        run: |
          rm -f .github/workflows/strip-indications.yml
          git config user.name "Chris Chreece"
          git config user.email "68458228+Chreece@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Move investment indications to dedicated branch"
          git push origin HEAD:remove-indications-main
