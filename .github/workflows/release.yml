name: Release

on:
  push:
    branches:
      - master
    paths:
      - custom_components/investment/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read integration version
        id: version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("custom_components/investment/manifest.json").read_text())["version"])
          PY
          )"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi
          gh release create "$VERSION"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "$VERSION"             --generate-notes
